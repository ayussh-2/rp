<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Rover wheel DEM v2, 2D low-gravity sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #e8ebee;
        --panel: #f6f7f8;
        --ink: #18212c;
        --muted: #5b6571;
        --line: #c5cbd2;
        --reg-a: #a59f95;
        --reg-b: #88827a;
        --fines: #3a3632;
        --ejecta: #d9801f;
        --wheel: #27435f;
        --wheel-2: #93a6ba;
        --accent: #27435f;
        --warn: #9a4a12;
        --bad: #a3231b;
        --trace: 217, 128, 31;
        --s1: #27435f;
        --s2: #b5471d;
        --s3: #3f7d4e;
        --s4: #7a4e9c;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1216;
          --panel: #151a20;
          --ink: #e1e6eb;
          --muted: #8b95a1;
          --line: #2a323b;
          --reg-a: #7e7a73;
          --reg-b: #615e58;
          --fines: #d6cfc2;
          --ejecta: #f2a23c;
          --wheel: #a9c3de;
          --wheel-2: #4d6076;
          --accent: #a9c3de;
          --warn: #f0a060;
          --bad: #ff7b6e;
          --trace: 242, 162, 60;
          --s1: #a9c3de;
          --s2: #f08a5d;
          --s3: #7cc48d;
          --s4: #c6a2e8;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1216;
        --panel: #151a20;
        --ink: #e1e6eb;
        --muted: #8b95a1;
        --line: #2a323b;
        --reg-a: #7e7a73;
        --reg-b: #615e58;
        --fines: #d6cfc2;
        --ejecta: #f2a23c;
        --wheel: #a9c3de;
        --wheel-2: #4d6076;
        --accent: #a9c3de;
        --warn: #f0a060;
        --bad: #ff7b6e;
        --trace: 242, 162, 60;
        --s1: #a9c3de;
        --s2: #f08a5d;
        --s3: #7cc48d;
        --s4: #c6a2e8;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 "Barlow",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .wrap {
        display: grid;
        grid-template-columns: 318px minmax(0, 1fr);
        min-height: 100vh;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 18px 16px 28px;
        overflow-y: auto;
        max-height: 100vh;
        position: sticky;
        top: 0;
      }
      main {
        padding: 18px 22px 28px;
        min-width: 0;
      }
      h1 {
        font:
          600 22px/1.15 "Barlow Semi Condensed",
          "Barlow",
          sans-serif;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        font-size: 13.5px;
        margin: 0 0 12px;
      }
      details {
        border-top: 1px solid var(--line);
        padding: 8px 0;
      }
      summary {
        font:
          600 15px "Barlow Semi Condensed",
          "Barlow",
          sans-serif;
        cursor: pointer;
        padding: 2px 0;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 92px 44px;
        align-items: center;
        gap: 6px;
        margin: 6px 0;
      }
      .row label {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.25;
      }
      .row input[type="number"],
      .row select {
        font: inherit;
        font-size: 13.5px;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 5px;
        width: 100%;
      }
      .row select {
        grid-column: 2/4;
      }
      .row .u {
        font-size: 12px;
        color: var(--muted);
      }
      .row.chk {
        grid-template-columns: auto 1fr;
      }
      .row.chk label {
        color: var(--ink);
      }
      .row input.bad {
        border-color: var(--bad);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 0 0 10px;
      }
      button,
      .bar select {
        font:
          500 14px "Barlow",
          sans-serif;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 7px 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ejecta);
        outline-offset: 2px;
      }
      .status {
        font-size: 13.5px;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .status b {
        color: var(--ink);
        font-weight: 600;
      }
      .checks {
        font-size: 13px;
        margin: 0 0 10px;
        padding: 0;
        list-style: none;
      }
      .checks li {
        padding: 2px 0 2px 16px;
        position: relative;
      }
      .checks li::before {
        content: "";
        position: absolute;
        left: 3px;
        top: 9px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .checks li.e {
        color: var(--bad);
      }
      .checks li.e::before {
        background: var(--bad);
      }
      .checks li.w {
        color: var(--warn);
      }
      .checks li.w::before {
        background: var(--warn);
      }
      .checks li.i {
        color: var(--muted);
      }
      .checks li.i::before {
        background: var(--muted);
      }
      .stage {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      #view {
        display: block;
        width: 100%;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 12.5px;
        color: var(--muted);
        margin: 8px 2px 0;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: -1px;
      }
      .legend i.dash {
        border-radius: 0;
        height: 0;
        border-top: 2px dashed var(--muted);
        width: 14px;
      }
      .readout {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        margin: 14px 0;
      }
      .readout div {
        background: var(--panel);
        padding: 7px 10px;
        box-shadow: 0 0 0 0.5px var(--line);
      }
      .readout span {
        display: block;
        font-size: 12px;
        color: var(--muted);
      }
      .readout b {
        font:
          600 17px "Barlow Semi Condensed",
          "Barlow",
          sans-serif;
      }
      .charts {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 12px;
      }
      .chart {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px 6px;
      }
      .chart h3 {
        font:
          600 14px "Barlow Semi Condensed",
          "Barlow",
          sans-serif;
        margin: 0;
      }
      .chart p {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 2px;
        min-height: 1.2em;
      }
      .chart canvas {
        display: block;
        width: 100%;
        height: 160px;
      }
      @media (max-width: 900px) {
        .wrap {
          grid-template-columns: 1fr;
        }
        aside {
          position: static;
          max-height: none;
          border-right: 0;
          border-top: 1px solid var(--line);
          order: 2;
        }
        main {
          order: 1;
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <aside>
        <h1>Rover wheel DEM</h1>
        <p class="sub">
          Every input is free entry. Values are checked, not capped. Lengths in
          mm.
        </p>
        <div id="controls"></div>
      </aside>
      <main>
        <div class="bar">
          <button class="primary" id="btnBed">Build bed and run</button>
          <button id="btnRerun">Rerun wheel on this bed</button>
          <button id="btnRelease">Release wheel</button>
          <button id="btnPause">Pause</button>
          <button id="btnStep">Step</button>
          <select id="speed" aria-label="Simulation speed">
            <option value="max">Full speed</option>
            <option value="slow">Slow motion</option>
          </select>
          <select id="colour" aria-label="Colour grains by">
            <option value="layers">Colour: layers</option>
            <option value="speed">Colour: speed</option>
            <option value="plain">Colour: fines only</option>
          </select>
          <button id="btnCsv">Export time series</button>
          <button id="btnEjCsv">Export ejecta</button>
        </div>
        <div class="status" id="status"></div>
        <ul class="checks" id="checks"></ul>
        <div class="stage"><canvas id="view"></canvas></div>
        <div class="legend">
          <span
            ><i style="background: var(--reg-a)"></i>Coarse grains (layer
            bands)</span
          >
          <span><i style="background: var(--fines)"></i>Fines</span>
          <span
            ><i style="background: var(--ejecta)"></i>Airborne fines and their
            paths</span
          >
          <span
            ><i style="background: var(--wheel)"></i>Rim and grousers
            (contact)</span
          >
          <span><i style="background: var(--wheel-2)"></i>Spokes and hub</span>
          <span><i class="dash"></i>Settled surface at release</span>
        </div>
        <div class="readout" id="readout"></div>
        <div class="charts" id="charts"></div>
      </main>
    </div>

    <script>
      // CORE-START
      const DEFAULTS = {
        g: 1.62,
        depositEarth: false,
        boundary: "periodic",
        level: true,
        L: 0.7,
        H: 0.08,
        rMin: 2.5e-3,
        rMean: 3.0e-3,
        rMax: 3.5e-3,
        rFine: 1.5e-3,
        finesFrac: 0.1,
        rho: 2600,
        seed: 0,
        muPrep: 0.1,
        alphaPrep: 0.3,
        vMeanTol: 1e-3,
        vMaxTol: 1e-2,
        tHold: 0.05,
        tSettleMin: 0.3,
        tSettleMax: 6,
        kn: 1e6,
        ktRatio: 0.5,
        en: 0.3,
        mu: 0.5,
        muR: 0.3,
        muWall: 0.5,
        muWheel: 0.7,
        R: 0.07,
        rwp: 2e-3,
        nSpokes: 6,
        hubFrac: 0.2,
        nGrousers: 0,
        hGrouser: 0.008,
        wheelMass: 25,
        dropHeight: 0.02,
        x0: -1,
        autoRelease: true,
        vyRestTol: 5e-3,
        tRestHold: 0.05,
        tRestMax: 1.0,
        direction: "ccw",
        omega: 3,
        mode: "slip",
        slip: 0.2,
        drawbarLoad: 0,
        tRamp: 0.2,
        tDrive: 1.8,
        tCoast: 0.6,
        stopBeforeLap: true,
        dtFactor: 0.12,
        logEvery: 0.005,
        tMinFlight: 0.01,
      };
      const SL = 12; // contact-history slots per grain

      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function triangular(u, a, c, b) {
        // min a, mode c, max b
        if (b <= a) return a;
        c = Math.min(b, Math.max(a, c));
        const f = (c - a) / (b - a);
        return u < f
          ? a + Math.sqrt(u * (b - a) * (c - a))
          : b - Math.sqrt((1 - u) * (b - a) * (b - c));
      }

      class RoverDEM {
        constructor(params) {
          this.p = Object.assign({}, DEFAULTS, params);
          this.seedUsed =
            this.p.seed > 0
              ? Math.floor(this.p.seed)
              : 1 + Math.floor(Math.random() * 1e9);
          this.rng = mulberry32(this.seedUsed);
          this.periodic = this.p.boundary === "periodic";
          this.hL = 0.5 * this.p.L;
          this.buildWheel();
          this.buildBed();
        }
        mi(dx) {
          if (!this.periodic) return dx;
          if (dx > this.hL) return dx - this.p.L;
          if (dx < -this.hL) return dx + this.p.L;
          return dx;
        }
        wrap(x) {
          if (!this.periodic) return x;
          const L = this.p.L;
          x %= L;
          return x < 0 ? x + L : x;
        }
        // --------------------------------------------------------------- wheel
        buildWheel() {
          const p = this.p,
            R = p.R,
            rp = p.rwp,
            Rc = R - rp,
            cx = [],
            cy = [];
          const n = Math.max(8, Math.ceil((2 * Math.PI * Rc) / rp));
          for (let k = 0; k < n; k++) {
            const a = (2 * Math.PI * k) / n;
            cx.push(Rc * Math.cos(a));
            cy.push(Rc * Math.sin(a));
          }
          this.nRim = n;
          this.Rtip = R;
          const nrad = Math.floor(p.hGrouser / rp + 1e-9);
          if (p.nGrousers > 0 && nrad > 0) {
            for (let k = 0; k < p.nGrousers; k++) {
              const a = (2 * Math.PI * k) / p.nGrousers + Math.PI / p.nGrousers;
              for (let q = 1; q <= nrad; q++) {
                cx.push((Rc + q * rp) * Math.cos(a));
                cy.push((Rc + q * rp) * Math.sin(a));
              }
            }
            this.Rtip = Rc + nrad * rp + rp;
          }
          this.nGrouserPts = cx.length - n;
          this.wcx = Float64Array.from(cx);
          this.wcy = Float64Array.from(cy);
          this.Nw = cx.length;
          this.wrx = new Float64Array(this.Nw);
          this.wry = new Float64Array(this.Nw);
          this.wpx = new Float64Array(this.Nw);
          this.wpy = new Float64Array(this.Nw);
          const vx = [],
            vy = [],
            Rh = Math.max(p.hubFrac * R, rp),
            nh = Math.max(6, Math.ceil((2 * Math.PI * Rh) / rp));
          for (let k = 0; k < nh; k++) {
            const a = (2 * Math.PI * k) / nh;
            vx.push(Rh * Math.cos(a));
            vy.push(Rh * Math.sin(a));
          }
          for (let k = 0; k < p.nSpokes; k++) {
            const a = (2 * Math.PI * k) / p.nSpokes;
            for (let rr = Rh + rp; rr < Rc - 0.5 * rp; rr += rp) {
              vx.push(rr * Math.cos(a));
              vy.push(rr * Math.sin(a));
            }
          }
          this.wvx = Float64Array.from(vx);
          this.wvy = Float64Array.from(vy);
          if (this.next && this.N)
            this.next = new Int32Array(this.N + this.Nw + 8);
        }
        // ----------------------------------------------------------------- bed
        buildBed() {
          const p = this.p,
            rng = this.rng,
            big = Math.max(p.rMax, p.rFine),
            s0 = 2 * big * 1.05;
          let nCol, s, xs;
          if (this.periodic) {
            nCol = Math.max(3, Math.floor(p.L / s0));
            s = p.L / nCol;
            xs = 0.5 * s;
          } else {
            nCol = Math.max(1, Math.floor((p.L - 2.4 * big) / s0) + 1);
            s = s0;
            xs = 1.2 * big;
          }
          const target = (p.level ? 1.2 : 1.0) * p.L * p.H * 0.83;
          const X = [],
            Y = [],
            R = [],
            F = [];
          let area = 0,
            yrow = 1.2 * big;
          while (area < target) {
            for (let c = 0; c < nCol; c++) {
              const isF = rng() < p.finesFrac,
                rr = isF ? p.rFine : triangular(rng(), p.rMin, p.rMean, p.rMax);
              X.push(this.wrap(xs + c * s + (rng() - 0.5) * 0.06 * s));
              Y.push(yrow + (rng() - 0.5) * 0.03 * s);
              R.push(rr);
              F.push(isF ? 1 : 0);
              area += Math.PI * rr * rr;
            }
            yrow += s;
            if (X.length > 300000)
              throw new Error(
                "More than 300 000 grains requested. Reduce the bed size or increase grain radii.",
              );
          }
          this.yGenTop = yrow + big;
          this.setParticles(X, Y, R, F);
          for (let i = 0; i < this.N; i++) this.vx[i] = (rng() - 0.5) * 0.02;
          let mmin = Infinity;
          for (let i = 0; i < this.N; i++) mmin = Math.min(mmin, this.m[i]);
          this.dt = p.dtFactor * Math.PI * Math.sqrt((0.5 * mmin) / p.kn);
          const le = Math.log(Math.max(p.en, 1e-3));
          this.beta2 = 2 * (-le / Math.sqrt(le * le + Math.PI * Math.PI));
          this.kn = p.kn;
          this.kt = p.ktRatio * p.kn;
          this.walls = this.periodic
            ? [[0, 0, p.L, 0]]
            : [
                [0, 0, p.L, 0],
                [0, 0, 0, 50],
                [p.L, 0, p.L, 50],
              ];
          this.phase = "deposit";
          this.t = 0;
          this.tPhase = 0;
          this.kPhase = 0;
          this.hold = 0;
          this.extend = 1;
          this.wheelOn = false;
          this.halted = null;
          this.settleLog = { t: [], vm: [], vx: [] };
          this.resetWheelLogs();
        }
        setParticles(X, Y, R, F) {
          const N = X.length;
          this.N = N;
          const A = () => new Float64Array(N);
          this.x = Float64Array.from(X);
          this.xu = Float64Array.from(X);
          this.y = Float64Array.from(Y);
          this.r = Float64Array.from(R);
          this.vx = A();
          this.vy = A();
          this.w = A();
          this.m = A();
          this.I = A();
          this.fx = A();
          this.fy = A();
          this.tq = A();
          this.nc = new Uint16Array(N);
          this.fine = Uint8Array.from(F);
          this.layer = new Uint8Array(N);
          for (let i = 0; i < N; i++) {
            const r = this.r[i];
            this.m[i] = this.p.rho * Math.PI * r * r;
            this.I[i] = 0.5 * this.m[i] * r * r;
          }
          this.hP = new Int32Array(N * SL);
          this.hS = new Float64Array(N * SL);
          this.hC = new Uint8Array(N);
          this.nP = new Int32Array(N * SL);
          this.nS = new Float64Array(N * SL);
          this.nC = new Uint8Array(N);
          this.next = new Int32Array(N + this.Nw + 8);
        }
        resetWheelLogs() {
          this.log = {
            t: [],
            dist: [],
            sink: [],
            slip: [],
            dp: [],
            tq: [],
            vx: [],
            vy: [],
            fy: [],
            air: [],
          };
          this.events = [];
          this.nextLog = 0;
          this.facc = [0, 0, 0];
          this.nacc = 0;
          this.ev = {
            n: 0,
            sumAbs: 0,
            maxAbs: 0,
            maxTf: 0,
            rear: 0,
            maxApex: 0,
          };
          this.settleTime = null;
          this.nAir = 0;
          this.tracking = false;
          this.FW = [0, 0, 0];
          this.nWc = 0;
          this.stopReason = "";
          this.tDriveStart = null;
          this.tStop = null;
        }
        // ------------------------------------------------------------- contact
        kernel(i, j, nx, ny, ov, vrx, vry, meff, mu) {
          const tx = -ny,
            ty = nx,
            vn = vrx * nx + vry * ny,
            vt = vrx * tx + vry * ty;
          let fn = this.kn * ov + this.beta2 * Math.sqrt(meff * this.kn) * vn;
          if (fn < 0) fn = 0;
          const b = i * SL,
            hc = this.hC[i];
          let s0 = 0;
          for (let k = 0; k < hc; k++) {
            if (this.hP[b + k] === j) {
              s0 = this.hS[b + k];
              break;
            }
          }
          let st = s0 + vt * this.dt;
          let ft = -this.kt * st - this.beta2 * Math.sqrt(meff * this.kt) * vt;
          const lim = mu * fn;
          if (Math.abs(ft) > lim) {
            ft = Math.sign(ft) * lim;
            st = -ft / this.kt;
          }
          const c = this.nC[i];
          if (c < SL) {
            this.nP[b + c] = j;
            this.nS[b + c] = st;
            this.nC[i] = c + 1;
          }
          this._fn = fn;
          this._ft = ft;
        }
        step(g, mu, alpha) {
          const p = this.p,
            N = this.N,
            dt = this.dt,
            muR = p.muR,
            L = p.L,

          x0: 0,

          hi: 1,
        });
        lineChart(
          "cDP",
          T,
          [
            { v: L.dp, c: C.s2, w: 0.8, a: 0.35 },
            { v: smooth(L.dp), c: C.s2, w: 1.6 },
          ],
          { vlines: vl, xu: " s", x0: 0, dec: 1 },
        );
        lineChart(
          "cTq",
          T,
          [
            { v: L.tq, c: C.s3, w: 0.8, a: 0.35 },
            { v: smooth(L.tq), c: C.s3, w: 1.6 },
          ],
          { vlines: vl, xu: " s", x0: 0, dec: 3 },
        );
        lineChart(
          "cVel",
          T,
          [
            { v: L.vx, c: C.s1 },
            { v: L.vy, c: C.s2 },
          ],
          { vlines: vl, xu: " s", x0: 0, dec: 3 },
        );
        lineChart("cFy", T, [{ v: smooth(L.fy, 3), c: C.s4 }], {
          vlines: vl,
          xu: " s",
          x0: 0,
          hlines: [{ y: sim.p.wheelMass * sim.p.g, c: C.muted }],
          dec: 1,
        });
        lineChart("cAir", T, [{ v: L.air, c: C.s2 }], {
          vlines: vl,
          xu: " s",
          x0: 0,
          lo: 0,
          dec: 0,
        });
        const E = sim.events;
        histChart(
          "cHist",
          E.map((e) => e.dx * 1e3),
        );
        scatterChart(
          "cBall",
          E.map((e) => e.tb),
          E.map((e) => e.tf),
          { oneToOne: true },
        );
        scatterChart(
          "cLaunch",
          E.map((e) => e.v0),
          E.map((e) => e.dx * 1e3),
          { dec: 1 },
        );
      }
      function frame() {
        if (running && sim && !err) {
          try {
            if ($("speed").value === "slow") {
              for (let k = 0; k < 20; k++)
                if (!sim.advance()) {
                  running = false;
                  break;
                }
            } else {
              const t0 = performance.now();
              outer: while (performance.now() - t0 < 22) {
                for (let k = 0; k < 25; k++)
                  if (!sim.advance()) {
                    running = false;
                    break outer;
                  }
              }
            }
          } catch (e) {
            err = e.message;
            running = false;
          }
          if (!running) setPauseLabel();
        }
        draw();
        if (frameNo++ % 4 === 0) updateUI();
        requestAnimationFrame(frame);
      }
      buildControls();
      buildCharts();
      readColours();
      refreshChecks();
      resize();
      newBed();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
